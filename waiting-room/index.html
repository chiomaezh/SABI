<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="https://use.typekit.net/bwp0bbg.css">

  <title>Waiting Room — SABI</title>
  <meta name="description" content="A London-based creative consultancy offering strategy, production, and design for culture-shaping presence and storytelling." />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    :root {
      --bg: #FAFBE3;
      --text: #211D1D;
      --wine: #170006;
      --font-body: 'owners-text', sans-serif;
      --font-mono: 'gemeli-mono', serif;
    }

    ::selection { background: rgba(183, 184, 168, 0.4); }
    ::-moz-selection { background: rgba(183, 184, 168, 0.4); }

    body {
      font-family: var(--font-body);
      font-weight: 350;
      color: var(--text);
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    /* ── Fixed viewfinder: grid of wine-top / wine-bottom / cream ── */
    .viewfinder {
      position: fixed;
      inset: 0;
      display: grid;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      grid-template-areas:
        "top    right"
        "bottom right";
    }

    .wine-block {
      background: var(--wine);
      height: 100%;
      position: relative;
    }
    .wine-block--top { grid-area: top; }
    .wine-block--bottom { grid-area: bottom; }

    .panel--right {
      grid-area: right;
      height: 100%;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Header (overlaid, no divider, positions unchanged) ── */
    .header-wrap {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      padding: 1.6rem 1.5rem 0;
    }
    @media (min-width: 721px) {
      .header-wrap {
        padding: 2.25rem 2.5rem 0;
      }
    }

    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .site-name {
      font-family: "all-round-gothic", sans-serif;
      font-weight: 400;
      font-size: 24px;
      text-transform: uppercase;
      letter-spacing: 0px;
      color: var(--text);
      text-decoration: none;
    }

    /* Hamburger — recoloured to the standard bg colour so it reads
       against the wine panel underneath it */
    .menu-btn-wrap { position: relative; }
    .menu-btn {
      position: relative;
      width: 22px;
      height: 16px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }
    .menu-btn span {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--bg);
      transition: transform 0.25s ease, top 0.25s ease;
    }
    .menu-btn span:first-child { top: 1.75px; }
    .menu-btn span:last-child { top: 12.25px; }
    .menu-btn.open span { height: 1.8px; }
    .menu-btn.open span:first-child { top: 7px; transform: rotate(45deg); }
    .menu-btn.open span:last-child { top: 7px; transform: rotate(-45deg); }

    .menu-accordion {
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 0.75rem;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s ease;
    }
    .menu-accordion.open { max-height: 220px; }
    .menu-list {
      display: flex;
      flex-direction: column;
    }
    .menu-list a {
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--bg);
      text-decoration: none;
      padding: 0.5rem 0;
      white-space: nowrap;
    }
    .menu-list a.active {
      color: rgba(250, 251, 227, 0.45);
      pointer-events: none;
      cursor: default;
    }

    /* ── CD + player, right panel ── */
    .music-stack {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
      margin-top: 4rem;
    }

    .cd-stack {
      position: relative;
      width: min(384px, 62vw);
      height: min(384px, 62vw);
    }

    .cd-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(0deg);
      opacity: 0.55;
      pointer-events: none;
      user-select: none;
    }
    .cd-image--spin {
      animation: spin-cd 9s linear infinite;
      animation-play-state: paused;
    }
    .cd-image--spin.playing {
      animation-play-state: running;
    }

    @media (min-width: 651px) {
      .music-stack {
        margin-top: 8rem;
        padding-bottom: 3.5rem;
      }
      .cd-stack {
        width: min(307px, 49.6vw);
        height: min(307px, 49.6vw);
      }
    }

    @keyframes spin-cd {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .player-wrap {
      position: relative;
      z-index: 2;
      width: min(380px, 84vw);
    }

    /* ── Small screens: stack panels, page scrolls, logo turns white ── */
    @media (max-width: 650px) {
      html, body {
        height: auto;
        overflow-y: auto;
        overflow-x: hidden;
      }

      .viewfinder {
        position: static;
        display: grid;
        width: 100%;
        height: auto;
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        grid-template-areas:
          "top"
          "right"
          "bottom";
      }

      .wine-block--top {
        height: 30vh;
        min-height: 220px;
      }
      .wine-block--bottom {
        height: 18vh;
        min-height: 160px;
      }
      .panel--right {
        height: auto;
        min-height: 70vh;
        padding-bottom: 4rem;
      }

      /* header overlays the wine band at the top on mobile, so both
         the hamburger and the logo need to read against wine */
      .site-name { color: var(--bg); }
    }
  </style>
</head>
<body>

  <div class="viewfinder">
    <div class="wine-block wine-block--top"></div>
    <div class="panel--right">
      <div class="music-stack">
        <div class="cd-stack">
          <img src="blank_CD.png" alt="" class="cd-image cd-image--spin" id="cdImage" />
        </div>
        <div class="player-wrap">
          <div id="spotify-embed"></div>
        </div>
      </div>
    </div>
    <div class="wine-block wine-block--bottom"></div>
  </div>

  <div class="header-wrap">
    <header class="site-header">
      <div class="menu-btn-wrap">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">
          <span></span>
          <span></span>
        </button>
        <nav class="menu-accordion" id="menuAccordion">
          <div class="menu-list">
            <a href="https://sabi.london/about/">About</a>
            <a href="https://sabi.london/services/">Services</a>
            <a href="https://play.sabi.london/word-search/">Play</a>
          </div>
        </nav>
      </div>
      <a href="https://sabi.london/" class="site-name">S A B I</a>
    </header>
  </div>

  <script>
    const menuBtn = document.getElementById('menuBtn');
    const menuAccordion = document.getElementById('menuAccordion');

    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = menuAccordion.classList.toggle('open');
      menuBtn.classList.toggle('open', isOpen);
      menuBtn.setAttribute('aria-expanded', isOpen);
    });
  </script>

  <!-- ── Spotify IFrame API: syncs CD spin to actual playback state ── -->
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
  <script>
    window.onSpotifyIframeApiReady = (IFrameAPI) => {
      const element = document.getElementById('spotify-embed');
      const cdImage = document.getElementById('cdImage');

      const options = {
        uri: 'spotify:playlist:0XXOJH57JlfsukZGkiRdKz',
        width: '100%',
        height: '152'
      };

      const callback = (EmbedController) => {
        EmbedController.addListener('playback_update', (e) => {
          if (e.data.isPaused) {
            cdImage.classList.remove('playing');
          } else {
            cdImage.classList.add('playing');
          }
        });
      };

      IFrameAPI.createController(element, options, callback);
    };
  </script>

</body>
</html>
